# LoRA fine-tuning of Llama 3.2 1B Instruct (4-bit) on 400 Turkish law Q&A pairs.
# Mirrors the reference project (MoAshour93/MLX_Finetuning, notebook cell 13) step by step,
# adapted to a MacBook Air M3 / 16 GB. Every value is explained in docs/10-law-qa-experiment.md.
# Run from the project root:  mlx_lm.lora -c training/configs/law-qa-lora.yaml

# --- What to train --------------------------------------------------------------------------
model: models/Llama-3.2-1B-Instruct-4bit   # reference: Mistral-7B 16-bit (20 GB peak, does not fit 16 GB)
train: true
data: data/law-qa                          # train.jsonl 400 / valid.jsonl 49 / test.jsonl 50
fine_tune_type: lora                       # reference: lora
mask_prompt: true                          # loss only on the assistant answer (flag did not exist in the reference's mlx-lm)

# --- Where to put the adapters ----------------------------------------------------------------
num_layers: 16                             # ALL 16 blocks of the 1B model (reference: 16 of 32 Mistral blocks)
lora_parameters:
  rank: 8                                  # mlx-lm default; reference used the default too
  scale: 20.0                              # mlx-lm has no "alpha"; delta W = scale * B A
  dropout: 0.0
  # keys not set -> all 7 linear layers per block: q,k,v,o,gate,up,down (5,636,096 trainable params)

# --- How long ---------------------------------------------------------------------------------
batch_size: 4                              # floor(400/4) = 100 steps per epoch, 0 examples dropped
grad_accumulation_steps: 1                 # effective batch = 4
iters: 600                                 # 600 / 100 = 6 epochs (reference rationale: aim for 5-8 epochs)
learning_rate: 1.0e-5                      # mlx-lm default and the value in the reference's measured run

# --- Monitoring and checkpoints ---------------------------------------------------------------
val_batches: -1                            # whole validation set: floor(49/4) = 12 batches = 48 examples
steps_per_report: 10                       # reference: 10
steps_per_eval: 50                         # 1 + 600/50 = 13 validation measurements
save_every: 50                             # = steps_per_eval -> every val loss has a checkpoint (12 + final)
adapter_path: adapters/law-qa-r8

# --- Memory and reproducibility ---------------------------------------------------------------
max_seq_length: 512                        # longest example is 204 tokens; padding follows real lengths
grad_checkpoint: true                      # reference: on
seed: 42                                   # reference: 42

# --- Test (used by `--test`) ------------------------------------------------------------------
test_batches: -1                           # whole test set: floor(50/4) = 12 batches = 48 examples
